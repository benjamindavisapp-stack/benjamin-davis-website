<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" fill="#0b0c0e"/>

  <!-- Lattice struts -->
  <line x1="0"  y1="0"  x2="16" y2="16" stroke="#23262c" stroke-width="0.8"/>
  <line x1="32" y1="0"  x2="16" y2="16" stroke="#23262c" stroke-width="0.8"/>
  <line x1="0"  y1="32" x2="16" y2="16" stroke="#23262c" stroke-width="0.8"/>
  <line x1="32" y1="32" x2="16" y2="16" stroke="#23262c" stroke-width="0.8"/>
  <line x1="16" y1="0"  x2="16" y2="32" stroke="#23262c" stroke-width="0.6"/>
  <line x1="0"  y1="16" x2="32" y2="16" stroke="#23262c" stroke-width="0.6"/>

  <!-- Outer border -->
  <rect x="1" y="1" width="30" height="30" fill="none" stroke="#23262c" stroke-width="1"/>

  <!-- Corner bolts -->
  <circle cx="3"  cy="3"  r="1.2" fill="none" stroke="#4a3b24" stroke-width="0.8"/>
  <circle cx="29" cy="3"  r="1.2" fill="none" stroke="#4a3b24" stroke-width="0.8"/>
  <circle cx="3"  cy="29" r="1.2" fill="none" stroke="#4a3b24" stroke-width="0.8"/>
  <circle cx="29" cy="29" r="1.2" fill="none" stroke="#4a3b24" stroke-width="0.8"/>

  <!-- BD monogram — gold gradient fill -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e5c48b"/>
      <stop offset="100%" stop-color="#c1773f"/>
    </linearGradient>
  </defs>
  <text
    x="16" y="21"
    font-family="'Arial Narrow', 'Saira Condensed', sans-serif"
    font-size="13"
    font-weight="900"
    fill="url(#g)"
    text-anchor="middle"
    letter-spacing="-0.5"
  >BD</text>
</svg>
